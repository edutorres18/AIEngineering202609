[project]
name = "estimador-cag"
version = "0.1.0"
description = "Servicio FastAPI que genera estimaciones de software a partir de la descripción del proyecto, con arquitectura CAG y prompts Jinja2 versionados"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=3.24.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

# Es una aplicación, no un paquete instalable: uv no necesita build-system.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Datos de referencia: frases largas legibles en una sola línea
"app/context/examples.py" = ["E501"]
