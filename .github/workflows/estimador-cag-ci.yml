name: estimador-cag CI

on:
  push:
    paths:
      - "estimador-cag/**"
      - ".github/workflows/estimador-cag-ci.yml"
  pull_request:
    paths:
      - "estimador-cag/**"
      - ".github/workflows/estimador-cag-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: estimador-cag

jobs:
  validate:
    name: Estructura, tests y arranque del servicio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ningún .env versionado
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::Hay un archivo .env versionado"; exit 1
          fi

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --locked

      - name: Lint y formato
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests (estructura, plantillas de prompt, endpoints, streaming e interfaz con LLM simulado)
        run: uv run pytest -v

      - name: Smoke test (arranca la API y la interfaz Streamlit)
        env:
          OPENAI_API_KEY: sk-ci-dummy
          LLM_PROVIDER: openai
          APP_ENV: test
        run: |
          # Binarios directos desde .venv (no "uv run") para no retener el lock de la caché de uv
          .venv/bin/uvicorn app.main:app --port 8000 &
          API_PID=$!
          .venv/bin/streamlit run streamlit_app.py --server.headless true --server.port 8501 &
          UI_PID=$!
          trap "kill $API_PID $UI_PID" EXIT
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && curl -sf http://localhost:8501/_stcore/health && break
            sleep 1
          done
          curl -sf http://localhost:8000/health
          curl -sf -o /dev/null http://localhost:8000/docs
          curl -sf http://localhost:8000/openapi.json | grep -q '/api/v1/estimate/stream'
          curl -sf http://localhost:8000/api/v1/context | grep -q 'system_prompt'
          # Las plantillas Jinja2 se cargan desde disco: un prompt renderizado con parámetros
          curl -sf 'http://localhost:8000/api/v1/context?output_format=narrative&detail_level=detailed' \
            | grep -q 'sin tablas ni listas'
          # Sesión 5: se crea una conversación y su contexto lleva el prompt v2 con la ficha
          SESSION_ID=$(curl -sf -X POST http://localhost:8000/sessions | python3 -c 'import json,sys; print(json.load(sys.stdin)["session_id"])')
          curl -sf "http://localhost:8000/sessions/$SESSION_ID" | grep -q '"max_turns":6'
          curl -sf "http://localhost:8000/api/v1/context?session_id=$SESSION_ID" | grep -q 'project_metadata'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/sessions/no-existe)" = 404
          curl -sf http://localhost:8501/_stcore/health

  live:
    name: Prueba end-to-end con el LLM real (manual)
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_PROVIDER: openai
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Comprobar secreto
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Configura el secreto OPENAI_API_KEY en el repositorio"; exit 1
          fi
      - name: Arrancar servidor y evaluar una estimación real
        run: |
          .venv/bin/uvicorn app.main:app --port 8000 &
          trap "kill $!" EXIT
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
          uv run python scripts/live_check.py --url http://localhost:8000
